spring:
  application:
    name: orcamento-voz-api
  ai:
    retry:
      # Falhas temporárias (rate limit, 5xx) são repetidas poucas vezes para não prender a requisição.
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      audio:
        transcription:
          options:
            model: whisper-1
            language: pt
        speech:
          options:
            model: tts-1
            voice: alloy
            response-format: mp3
            speed: 1.0
  http:
    client:
      connect-timeout: 10s
      read-timeout: 60s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:h2:file:./data/orcamento;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

budget:
  max-amount: 1000000.00
  max-past-years: 5
  duplicate-window: 2m
  audio:
    max-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: ${AI_LOG_LEVEL:INFO}
